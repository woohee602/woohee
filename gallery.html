<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 갤러리 | 아트그리고 화실</title>
<meta name="description" content="아트그리고 화실 수강생 작품 갤러리. 유화, 아크릴화, 기초소묘, 팝아트 초상화, 전시반 작품.">

<!-- 웹폰트 (메인 페이지와 동일) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ============================================================
   디자인 토큰 - 메인 페이지와 동일
   ============================================================ */
:root{
  --bg:        #ffffff;
  --bg-soft:   #f3f6f3;
  --ink:       #222b26;
  --ink-soft:  #66716b;
  --accent:    #2f5d46;
  --accent-deep:#234736;
  --gold:      #8fb3a0;
  --line:      #e4e9e5;
  --white:     #ffffff;
  --serif: 'Noto Serif KR', serif;
  --sans:  'Pretendard Variable', Pretendard, -apple-system, sans-serif;
  --side-pad: clamp(20px, 5vw, 48px);
}
*{ margin:0; padding:0; box-sizing:border-box; }
h1,h2,h3{ word-break:keep-all; overflow-wrap:break-word; }
body{
  font-family:var(--sans);
  background:var(--bg); color:var(--ink);
  line-height:1.75; font-size:16px;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
.container{ max-width:1120px; margin:0 auto; padding:0 var(--side-pad); }

/* ============================================================
   상단 바
   ============================================================ */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1120px; margin:0 auto; padding:0 var(--side-pad);
  height:60px; display:flex; align-items:center; justify-content:space-between;
}
.back-link{
  display:flex; align-items:center; gap:8px;
  font-size:14px; font-weight:600; color:var(--ink-soft); min-height:44px;
}
.back-link:hover{ color:var(--accent); }
.topbar .logo{ font-family:var(--serif); font-size:17px; font-weight:600; }
.topbar .logo em{ font-style:normal; color:var(--accent); }

/* ============================================================
   페이지 헤더
   ============================================================ */
.page-head{ padding:130px 0 40px; }
.page-head .eng{
  font-size:12px; letter-spacing:.3em; text-transform:uppercase;
  color:var(--accent); font-weight:600; display:block; margin-bottom:12px;
}
.page-head h1{
  font-family:var(--serif); font-weight:500;
  font-size:clamp(30px,6vw,44px); line-height:1.4; margin-bottom:12px;
}
.page-head p{ color:var(--ink-soft); font-size:15px; max-width:520px; }

/* ============================================================
   재료별 탭
   ============================================================ */
.tabs{
  display:flex; gap:8px; flex-wrap:wrap;
  padding:24px 0;
  position:sticky; top:60px; z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.tab{
  padding:10px 20px; min-height:44px;
  border:1px solid var(--line); border-radius:999px;
  background:var(--white); font-size:14px; font-weight:600;
  color:var(--ink-soft);
  transition:all .2s;
}
.tab:hover{ border-color:var(--accent); color:var(--accent); }
.tab.active{ background:var(--accent); border-color:var(--accent); color:var(--white); }
.tab .cnt{ font-size:12px; opacity:.7; margin-left:4px; }

/* ============================================================
   작품 그리드
   ============================================================ */
.grid{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:14px; padding-bottom:40px;
}
@media (min-width:700px){ .grid{ grid-template-columns:repeat(3,1fr); gap:18px; } }
@media (min-width:1000px){ .grid{ grid-template-columns:repeat(4,1fr); } }

.art-frame{
  background:var(--white);
  padding:8px;
  border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(34,43,38,.06);
  cursor:zoom-in;
  transition:transform .3s;
}
.art-frame:hover{ transform:scale(1.02); }
.art-frame img{
  width:100%; aspect-ratio:4/5; object-fit:cover; display:block;
}

/* 비어있는 카테고리 안내 */
.empty{
  padding:80px 20px; text-align:center;
  color:var(--ink-soft); font-size:15px;
  background:var(--bg-soft); border-radius:16px;
  margin-bottom:40px;
}
.empty .big{ font-size:34px; display:block; margin-bottom:12px; }

/* 더보기 버튼 */
.more-wrap{ text-align:center; padding-bottom:80px; }
.btn-more{
  padding:14px 36px; min-height:48px;
  border:1px solid var(--line); border-radius:999px;
  background:var(--white); font-size:15px; font-weight:600;
  transition:all .2s;
}
.btn-more:hover{ border-color:var(--accent); color:var(--accent); }
.btn-more[hidden]{ display:none; }

/* ============================================================
   라이트박스 (사진 크게 보기)
   ============================================================ */
.lightbox{
  position:fixed; inset:0; z-index:200;
  background:rgba(20,26,22,.94);
  display:none;
  align-items:center; justify-content:center;
  padding:24px;
}
.lightbox.open{ display:flex; }
.lightbox img{
  max-width:100%; max-height:86vh; object-fit:contain;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.lb-close{
  position:absolute; top:16px; right:16px;
  width:48px; height:48px; border:none; border-radius:50%;
  background:rgba(255,255,255,.12); color:#fff; font-size:22px;
}
.lb-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:48px; height:48px; border:none; border-radius:50%;
  background:rgba(255,255,255,.12); color:#fff; font-size:20px;
}
.lb-prev{ left:12px; } .lb-next{ right:12px; }

footer{
  background:var(--ink); color:#93a49a;
  padding:40px 0; font-size:13px; text-align:center;
}

/* SNS 플로팅 버튼 (전 페이지 공통) - 탭하면 펼쳐지는 방식 */
.sns-float{
  position:fixed; right:16px; bottom:24px; z-index:230;
  display:flex; flex-direction:column-reverse; align-items:center; gap:10px;
}
.sns-float a{
  width:44px; height:44px; border-radius:50%;
  background:var(--white); border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(34,43,38,.14);
  display:flex; align-items:center; justify-content:center;
  font-size:19px;
  transition:transform .25s, box-shadow .2s, opacity .25s;
}
.sns-float a:hover{ transform:translateY(-3px) scale(1.05); box-shadow:0 12px 26px rgba(34,43,38,.2); }
.sns-float a.kakao{ background:#FEE500; border-color:#FEE500; }
.sns-float a.insta{ background:radial-gradient(circle at 30% 110%, #fdf497, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.sns-float a.naver{ background:#03C75A; border-color:#03C75A; color:#fff; font-family:var(--serif); font-weight:700; font-size:17px; }
.sns-toggle{
  width:50px; height:50px; border-radius:50%;
  background:var(--accent); color:var(--white);
  border:none; box-shadow:0 8px 20px rgba(34,43,38,.22);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; line-height:1;
  transition:transform .25s, background .2s;
}
.sns-toggle.open{ transform:rotate(45deg); background:var(--accent-deep); }
.sns-links{ display:flex; flex-direction:column; gap:10px; align-items:center; }
.sns-links a{ opacity:0; transform:translateY(8px) scale(.8); pointer-events:none; }
.sns-float.open .sns-links a{ opacity:1; transform:none; pointer-events:auto; }
.sns-links a:nth-child(1){ transition-delay:.03s; }
.sns-links a:nth-child(2){ transition-delay:.06s; }
.sns-links a:nth-child(3){ transition-delay:.09s; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html#gallery" class="back-link">← 홈으로 돌아가기</a>
    <a href="index.html" class="logo">아트<em>그리고</em> 화실</a>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <span class="eng">Student Gallery</span>
      <h1>수강생 작품 갤러리</h1>
      <p>모두 그림이 처음이었던 분들의 작품입니다. 재료별로 골라 감상해 보세요.</p>
    </div>

    <!-- 재료별 탭: JS가 채움 -->
    <div class="tabs" id="tabs" role="tablist"></div>

    <!-- 작품 그리드: JS가 채움 -->
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <span class="big">🎨</span>
      아직 준비 중인 갤러리입니다.<br>작품이 차곡차곡 채워질 예정이에요.
    </div>
    <div class="more-wrap">
      <button class="btn-more" id="btnMore" hidden>더보기</button>
    </div>
  </div>
</main>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="닫기">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전 작품">‹</button>
  <img id="lbImg" src="" alt="작품 크게 보기">
  <button class="lb-nav lb-next" id="lbNext" aria-label="다음 작품">›</button>
</div>

<footer>
  <p>아트그리고 화실 · 인천광역시 부평구 길주로547번길 5, 401호 · 0507-1322-5279</p>
</footer>

<div class="sns-float" id="snsFloat">
  <button class="sns-toggle" id="snsToggle" aria-label="SNS 채널 열기" aria-expanded="false">＋</button>
  <div class="sns-links">
    <a href="http://pf.kakao.com/_gikBG/chat" target="_blank" rel="noopener" class="kakao" aria-label="카카오톡 채널 문의">💬</a>
    <a href="https://www.instagram.com/artgrigo_in" target="_blank" rel="noopener" class="insta" aria-label="인스타그램 바로가기">📷</a>
    <a href="https://blog.naver.com/dngml602" target="_blank" rel="noopener" class="naver" aria-label="네이버 블로그 바로가기">N</a>
  </div>
</div>

<script>
/* ============================================================
   갤러리 데이터
   - 새 작품을 추가하려면 해당 재료 배열에 파일 경로만 추가하면 됩니다
   - 사진 파일은 재료명 폴더(유화/, 아크릴/ 등)에 넣어 관리
   ============================================================ */
const G = '작품갤러리/';
const GALLERY = {
  '유화': [
    '20220312_104743.jpg','20220809_220114.jpg','20220826_144419.jpg','20220928_160752.jpg',
    '20230114_115520.jpg','20230211_145955.jpg','20230224_184455.jpg','20230506_180913.jpg',
    '20240105_220421.jpg','20240228_220539.jpg','20240307_163504.jpg','20240501_215930.jpg',
    '20240716_170536.jpg','20240716_170600.jpg','20240716_180616 (1).jpg','20240921_172813.jpg',
    '20241106_190227.jpg','20241127_175038.jpg','IMG_20231214_145918_781.jpg','IMG_20240125_162925_917.jpg'
  ].map(f => G + '유화/' + f),
  '아크릴화': [
    '20220722_195512.jpg','20220902_213607.jpg','20240810_120535.jpg','20240814_211528.jpg',
    '20240822_122101.jpg','20240822_122107.jpg','20240823_155330.jpg','20240913_211634.jpg',
    '20241023_205336.jpg'
  ].map(f => G + '아크릴화/' + f),
  '수채화': [
    '1669784977667.jpg','1672458817415.jpg','20220714_161104.jpg','20220730_115611.jpg',
    '20240425_155051.jpg','20241030_145523.jpg','20241127_210336.jpg',
    'KakaoTalk_20190717_122530297_26.jpg','KakaoTalk_20190717_123331884_26.jpg','KakaoTalk_20190717_123956214.jpg',
    'KakaoTalk_20190908_190848992_22.jpg','KakaoTalk_20191005_182324919_12.jpg','KakaoTalk_20191005_182324919_13.jpg',
    'KakaoTalk_20200714_182445314_14.jpg','KakaoTalk_20200825_120431625_13.jpg','KakaoTalk_20201231_164307507_26.jpg',
    'KakaoTalk_20201231_170316829_02.jpg','KakaoTalk_20201231_170316829_16.jpg'
  ].map(f => G + '수채화/' + f),
  '기초소묘': [
    '20220405_151156.jpg','20220427_121929.jpg','20240312_173236.jpg',
    '20240312_173357.jpg','20240312_173522.jpg','20240312_173727.jpg'
  ].map(f => G + '기초소묘/' + f),
  '인물화': [
    '20220728_144118.jpg','20220728_144128.jpg','20220823_184120.jpg','20230309_155429.jpg',
    '20230311_190710.jpg','20230317_192518.jpg','20231109_182209.jpg','20240130_201712.jpg',
    '20240312_173753.jpg','20240312_173944.jpg'
  ].map(f => G + '인물화/' + f),
  '색연필': [
    '20220525_145316.jpg','20220804_175842.jpg','20221213_180524.jpg','20230517_165917.jpg',
    '20231006_152711.jpg','20240202_171437.jpg',
    'KakaoTalk_20190103_232608850_03.jpg','KakaoTalk_20200103_163634144.jpg','KakaoTalk_20200115_122651672_02.jpg',
    'KakaoTalk_20200714_182445314_24.jpg','KakaoTalk_20201231_163913015_24.jpg','KakaoTalk_20201231_164307507_14.jpg'
  ].map(f => G + '색연필/' + f),
  '원데이클래스': [
    '20210818_220246.jpg','20220722_195512.jpg','20240202_171643.jpg',
    'KakaoTalk_20190908_191551587_13 (1).jpg','KakaoTalk_20200103_164128444_19.jpg','KakaoTalk_20200103_164454397_04.jpg',
    'KakaoTalk_20200103_171108036_16.jpg','KakaoTalk_20200210_170134597.jpg','KakaoTalk_20201231_170316829_21.jpg'
  ].map(f => G + '원데이클래스/' + f),
  '전시반': [
    '20221117_175900.jpg','20240813_172618.jpg','20240813_173122.jpg','20240813_173138.jpg',
    'KakaoTalk_20241003_210452238_08.jpg','KakaoTalk_20241003_210713282_08.jpg',
    'KakaoTalk_20251011_160031766_02.jpg','KakaoTalk_20251011_160031766_04.jpg','KakaoTalk_20251011_160031766_09.jpg',
    'KakaoTalk_20251011_160031766_10.jpg','KakaoTalk_20251011_160031766_15.jpg','KakaoTalk_20251011_160109073_01.jpg',
    '제목 없는 디자인 (1).jpg'
  ].map(f => G + '전시반/' + f)
};

const PER_PAGE = 20;               /* 항목당 한 번에 보여줄 사진 수 */
let current = Object.keys(GALLERY)[0];   /* 현재 선택된 재료 */
let shown = PER_PAGE;              /* 현재까지 펼쳐진 개수 */

const tabsEl  = document.getElementById('tabs');
const gridEl  = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const moreBtn = document.getElementById('btnMore');

/* 탭 버튼 생성 */
Object.entries(GALLERY).forEach(([name, list]) => {
  const b = document.createElement('button');
  b.className = 'tab' + (name === current ? ' active' : '');
  b.setAttribute('role', 'tab');
  b.innerHTML = name + (list.length ? `<span class="cnt">${list.length}</span>` : '');
  b.addEventListener('click', () => {
    current = name; shown = PER_PAGE;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    b.classList.add('active');
    render();
  });
  tabsEl.appendChild(b);
});

/* 현재 탭의 작품을 그리드에 그리기 */
function render(){
  const list = GALLERY[current];
  gridEl.innerHTML = '';
  emptyEl.hidden = list.length > 0;

  list.slice(0, shown).forEach((src, i) => {
    const f = document.createElement('figure');
    f.className = 'art-frame';
    f.innerHTML = `<img src="${src}" alt="${current} 수강생 작품 ${i+1}" loading="lazy">`;
    f.addEventListener('click', () => openLightbox(i));
    gridEl.appendChild(f);
  });

  /* 20개 넘게 남아있으면 더보기 버튼 표시 */
  moreBtn.hidden = list.length <= shown;
}
moreBtn.addEventListener('click', () => { shown += PER_PAGE; render(); });
render();

/* ============================================================
   라이트박스: 사진 클릭 시 크게 보기 + 이전/다음 넘기기
   ============================================================ */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
let lbIndex = 0;

function openLightbox(i){
  lbIndex = i;
  lbImg.src = GALLERY[current][lbIndex];
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
function step(d){
  const list = GALLERY[current];
  lbIndex = (lbIndex + d + list.length) % list.length;
  lbImg.src = list[lbIndex];
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); step(1); });
lb.addEventListener('click', e => { if(e.target === lb) closeLightbox(); });
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});

/* SNS 플로팅 버튼: 탭하면 펼쳐지고, 밖을 누르면 닫힘 */
const snsFloat = document.getElementById('snsFloat');
const snsToggle = document.getElementById('snsToggle');
snsToggle.addEventListener('click', () => {
  const isOpen = snsFloat.classList.toggle('open');
  snsToggle.setAttribute('aria-expanded', isOpen);
  snsToggle.textContent = isOpen ? '✕' : '＋';
});
document.addEventListener('click', (e) => {
  if (snsFloat.classList.contains('open') && !snsFloat.contains(e.target)) {
    snsFloat.classList.remove('open');
    snsToggle.setAttribute('aria-expanded', false);
    snsToggle.textContent = '＋';
  }
});
</script>

</body>
</html>
